services:
  api:
    build: .
    image: axdata
    restart: unless-stopped
    ports:
      - "8666:8666"
    environment:
      AXDATA_API_HOST: "0.0.0.0"
      AXDATA_API_PORT: "8666"
      AXDATA_WEB_PORT: "8667"
      AXDATA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./logs:/app/logs
      - ./cache:/app/cache

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8667:80"
    depends_on:
      - api

  # Post-close daily rebuild, Mon-Fri 16:00 Beijing (scripts/scheduler.py).
  # Lives in a container so nothing is installed on the host. Status:
  #   logs/scheduler/state.json   what the scheduler is waiting for
  #   logs/daily_update/*.json    one record per rebuild, `outcome` field
  # Manual run: docker compose exec scheduler python scripts/daily_update.py --force
  scheduler:
    build: .
    image: axdata
    entrypoint: ["python", "scripts/scheduler.py"]
    restart: unless-stopped
    environment:
      AXDATA_DATA_DIR: /app/data
      AXDATA_UPDATE_AT: "16:00"
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./logs:/app/logs
      - ./cache:/app/cache

  # One-shot collection jobs: docker compose run --rm worker update daily --source csv
  worker:
    build: .
    image: axdata
    profiles: ["tools"]
    entrypoint: ["python", "-m", "services.worker.cli"]
    environment:
      AXDATA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./logs:/app/logs
      - ./cache:/app/cache

  # stdio MCP server: docker compose run --rm -T mcp
  mcp:
    build: .
    image: axdata
    profiles: ["tools"]
    entrypoint: ["python", "apps/mcp/server.py"]
    stdin_open: true
    environment:
      AXDATA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./logs:/app/logs
      - ./cache:/app/cache
